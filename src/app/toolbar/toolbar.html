<div class="panel" role="toolbar" aria-label="Outils divins">
  @for (tool of tools; track tool.key) {
    <button
      type="button"
      class="tool"
      [class.active]="game.tool() === tool.id"
      [attr.aria-pressed]="game.tool() === tool.id"
      [title]="tool.hint + ' (' + tool.key + ')'"
      (click)="select(tool)"
    >
      <span>{{ tool.label }}</span>
      <kbd>{{ tool.key }}</kbd>
    </button>
  }

  <div class="size" [class.disabled]="game.tool() === null">
    <label for="brush-size">
      Taille <span class="value">{{ game.brushRadius() }}</span>
    </label>
    <input
      id="brush-size"
      type="range"
      step="1"
      [min]="minRadius"
      [max]="maxRadius"
      [value]="game.brushRadius()"
      (input)="onRadiusInput($event)"
    />
  </div>
</div>
